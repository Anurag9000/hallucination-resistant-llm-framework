<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2400" viewBox="0 0 1700 2400"><rect x="0" y="0" width="1700" height="2400" fill="#f8fafc"/>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#111827" />
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#1d4ed8" />
  </marker>
</defs>
<text x="60" y="80" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#111827">Final Thought v2.1 — Context-Aware Hallucination‑Resistant AI (ULTIMA‑X)</text><text x="60" y="120" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#374151">Anurag Basistha • Context Engine lane + evidence‑first generation + verifier mesh</text><text x="60" y="160" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#111827">Main Pipeline</text><line x1="60" y1="170" x2="820" y2="170" stroke="#9ca3af" stroke-width="1.5"/><text x="890" y="160" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#111827">Context Engine</text><line x1="890" y1="170" x2="1650" y2="170" stroke="#9ca3af" stroke-width="1.5"/><rect x="60" y="190" width="760" height="130" rx="18" ry="18" fill="#ffffff" stroke="#111827" stroke-width="2"/><circle cx="774" cy="212" r="16" fill="#111827" /><text x="767" y="218" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">0</text><text x="78" y="224" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#111827">0. LLM Output Interceptor</text><text x="78" y="260" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Capture drafts (stream/batch).</text>
<text x="78" y="284" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Route to verify/revise or evidence‑first decode.</text><line x1="440.0" y1="332" x2="440.0" y2="360" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="372" width="760" height="154" rx="18" ry="18" fill="#ffffff" stroke="#111827" stroke-width="2"/><circle cx="774" cy="394" r="16" fill="#111827" /><text x="767" y="400" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="78" y="406" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#111827">1. Grounding Gateway</text><text x="78" y="442" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Pull Context Pack (CP) from Context Engine.</text>
<text x="78" y="466" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Expand prompt → retrieve evidence (BM25 + dense).</text>
<text x="78" y="490" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• HARD‑gate high‑risk if context/evidence missing.</text><line x1="440.0" y1="538" x2="440.0" y2="566" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="578" width="760" height="130" rx="18" ry="18" fill="#ffffff" stroke="#111827" stroke-width="2"/><circle cx="774" cy="600" r="16" fill="#111827" /><text x="767" y="606" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="78" y="612" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#111827">2. Attribution‑First Decoder</text><text x="78" y="648" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Each sentence tagged: (evidence_id?, context_id?, confidence).</text>
<text x="78" y="672" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Require context_id for prior facts; forbid fabricated citations.</text><line x1="440.0" y1="720" x2="440.0" y2="748" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="760" width="760" height="130" rx="18" ry="18" fill="#ffffff" stroke="#111827" stroke-width="2"/><circle cx="774" cy="782" r="16" fill="#111827" /><text x="767" y="788" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="78" y="794" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#111827">3. Claim Decomposer</text><text x="78" y="830" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Extract atomic claims (entity, numeric, temporal, causal, quote, code).</text>
<text x="78" y="854" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Build claim graph linking claims ↔ evidence ↔ context.</text><line x1="440.0" y1="902" x2="440.0" y2="930" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="942" width="760" height="154" rx="18" ry="18" fill="#ffffff" stroke="#111827" stroke-width="2"/><circle cx="774" cy="964" r="16" fill="#111827" /><text x="767" y="970" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="78" y="976" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#111827">4. Verifier Mesh</text><text x="78" y="1012" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Evidence NLI (hard), Numeric/Unit (hard), Temporal (hard).</text>
<text x="78" y="1036" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• AIS Attribution (hard), Tools/Exec (hard), Consistency ensemble (soft).</text>
<text x="78" y="1060" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• CW: contradiction check against active context.</text><line x1="440.0" y1="1108" x2="440.0" y2="1136" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1148" width="760" height="130" rx="18" ry="18" fill="#ffffff" stroke="#111827" stroke-width="2"/><circle cx="774" cy="1170" r="16" fill="#111827" /><text x="767" y="1176" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="78" y="1182" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#111827">5. CoVe Self‑Audit</text><text x="78" y="1218" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Plan/answer verification Qs using evidence + context pack.</text>
<text x="78" y="1242" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Minimally repair failing spans.</text><line x1="440.0" y1="1290" x2="440.0" y2="1318" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1330" width="760" height="130" rx="18" ry="18" fill="#ffffff" stroke="#111827" stroke-width="2"/><circle cx="774" cy="1352" r="16" fill="#111827" /><text x="767" y="1358" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="78" y="1364" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#111827">6. Confidence Composer</text><text x="78" y="1400" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Aggregate verifier + context signals; calibrated score ∈ [0,1].</text>
<text x="78" y="1424" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• ≥0.90 Verified; 0.70–0.90 Likely; 0.40–0.70 Unverified; &lt;0.40 Block.</text><line x1="440.0" y1="1472" x2="440.0" y2="1500" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1512" width="760" height="130" rx="18" ry="18" fill="#ffffff" stroke="#111827" stroke-width="2"/><circle cx="774" cy="1534" r="16" fill="#111827" /><text x="767" y="1540" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="78" y="1546" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#111827">7. Output Rebuilder</text><text x="78" y="1582" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Emit only passing spans; citation map.</text>
<text x="78" y="1606" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" fill="#111827">• Badges: 📄 evidence • 🧠 context.</text><rect x="890" y="190" width="760" height="126" rx="16" ry="16" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/><text x="908" y="224" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">ST — Session Tracker</text><text x="908" y="258" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">• Rolling summary (≤1–3k tokens); entities, intents, assumptions.</text>
<text x="908" y="282" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">• Importance‑weighted pruning.</text><rect x="890" y="348" width="760" height="126" rx="16" ry="16" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/><text x="908" y="382" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">EM — Episodic Memory</text><text x="908" y="416" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">• Stable facts &amp; preferences (symbolic triples + vectors).</text>
<text x="908" y="440" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">• Per‑fact timestamps, confidence, TTL.</text><rect x="890" y="506" width="760" height="102" rx="16" ry="16" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/><text x="908" y="540" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">WN — Working Notes</text><text x="908" y="574" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">• Temporary TODOs/claims from CoVe; auto‑expire.</text><rect x="890" y="640" width="760" height="102" rx="16" ry="16" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/><text x="908" y="674" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">TW — Temporal Watcher</text><text x="908" y="708" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">• Detect staleness vs domain windows; prefer newer facts.</text><rect x="890" y="774" width="760" height="102" rx="16" ry="16" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/><text x="908" y="808" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">CW — Contradiction Watcher</text><text x="908" y="842" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">• Mini NLI vs ST/EM; flags conflicts for Verifier Mesh.</text><rect x="890" y="908" width="760" height="102" rx="16" ry="16" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/><text x="908" y="942" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">PPM — Preference/Policy Manager</text><text x="908" y="976" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">• User switches (language, style, tools), safety allowlists.</text><rect x="890" y="1042" width="760" height="102" rx="16" ry="16" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/><text x="908" y="1076" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">CP API — Context Pack</text><text x="908" y="1110" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">• GET /context/pack → {ST.summary + EM facts + artefacts + prefs}.</text><path d="M 890 1093.0 C 855.0 1093.0, 855.0 449.0, 820 449.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue)"/><path d="M 890 241.0 C 855.0 241.0, 855.0 437.0, 820 437.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue)"/><path d="M 890 423.0 C 855.0 423.0, 855.0 461.0, 820 461.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue)"/><path d="M 890 825.0 C 855.0 825.0, 855.0 1019.0, 820 1019.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue)"/><path d="M 890 681.0 C 855.0 681.0, 855.0 1009.0, 820 1009.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue)"/><path d="M 890 701.0 C 855.0 701.0, 855.0 1405.0, 820 1405.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue)"/><path d="M 890 959.0 C 855.0 959.0, 855.0 643.0, 820 643.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue)"/><path d="M 890 971.0 C 855.0 971.0, 855.0 1407.0, 820 1407.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue)"/><path d="M 890 557.0 C 855.0 557.0, 855.0 1213.0, 820 1213.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue)"/><rect x="60" y="2180" width="840" height="140" rx="14" ry="14" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="76" y="2210" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111827">Legend</text><text x="76" y="2244" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">White boxes: Main Pipeline   •   Blue boxes: Context Engine</text><text x="76" y="2272" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">📄 Evidence badge  → sentence backed by sources</text><text x="480" y="2272" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#111827">🧠 Context badge  → sentence bound to ST/EM</text><text x="60" y="2370" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#6b7280">© 2025 Anurag Basistha • Final Thought v2.1 — context‑aware, attribution‑first RAG with verifier mesh</text></svg>