<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2100" viewBox="0 0 1400 2100"><rect x="0" y="0" width="1400" height="2100" fill="#f8fafc"/><text x="60" y="70" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#111827">Final Thought v2.0 — Hallucination‑Resistant Factual AI (ULTIMA‑X)</text><text x="60" y="110" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#374151">Anurag Basistha • Attribution‑first RAG + Mesh Verification + Calibrated Confidence</text>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#1f2937" />
  </marker>
</defs>
<rect x="60" y="180" width="1280" height="130" rx="18" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="80" y="212" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#111827">0. LLM Output Interceptor 2.0</text><text x="80" y="250" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Capture drafts (stream/batch).</text>
<text x="80" y="276" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Route to verify/revise or evidence-first decode.</text><circle cx="1290" cy="200" r="16" fill="#111827" /><text x="1283" y="207" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">0</text><line x1="700.0" y1="326" x2="700.0" y2="358" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="358" width="1280" height="156" rx="18" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="80" y="390" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#111827">1. Grounding Gateway (pre‑gen)</text><text x="80" y="428" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Query plan (time, jurisdiction, units, schema).</text>
<text x="80" y="454" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Hybrid retrieval (BM25 + dense), recency &amp; domain allowlists.</text>
<text x="80" y="480" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Build evidence pack; HARD‑GATE high‑risk tasks if empty.</text><circle cx="1290" cy="378" r="16" fill="#111827" /><text x="1283" y="385" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">1</text><line x1="700.0" y1="530" x2="700.0" y2="562" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="562" width="1280" height="130" rx="18" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="80" y="594" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#111827">2. Attribution‑First Decoder</text><text x="80" y="632" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Each sentence tagged with (evidence_id, offsets, confidence).</text>
<text x="80" y="658" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Low‑temp factual spans; forbid fabricated citations.</text><circle cx="1290" cy="582" r="16" fill="#111827" /><text x="1283" y="589" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">2</text><line x1="700.0" y1="708" x2="700.0" y2="740" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="740" width="1280" height="130" rx="18" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="80" y="772" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#111827">3. Claim Decomposer</text><text x="80" y="810" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Extract atomic claims: entity, number/unit, temporal, causal, quote, code.</text>
<text x="80" y="836" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Build claim graph linking claims ↔ evidence.</text><circle cx="1290" cy="760" r="16" fill="#111827" /><text x="1283" y="767" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">3</text><line x1="700.0" y1="886" x2="700.0" y2="918" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="918" width="1280" height="130" rx="18" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="80" y="950" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#111827">4. Verifier Mesh</text><text x="80" y="988" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• NLI entailment (HARD), Numeric/Unit (HARD), Temporal (HARD),</text>
<text x="80" y="1014" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• AIS Attribution (HARD), Tools/Exec (HARD), Consistency ensemble (SOFT).</text><circle cx="1290" cy="938" r="16" fill="#111827" /><text x="1283" y="945" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">4</text><line x1="700.0" y1="1064" x2="700.0" y2="1096" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1096" width="1280" height="130" rx="18" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="80" y="1128" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#111827">5. CoVe Self‑Audit</text><text x="80" y="1166" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Plan/answer verification questions using evidence.</text>
<text x="80" y="1192" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Repair contradicted/neutral spans; minimal regen.</text><circle cx="1290" cy="1116" r="16" fill="#111827" /><text x="1283" y="1123" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">5</text><line x1="700.0" y1="1242" x2="700.0" y2="1274" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1274" width="1280" height="130" rx="18" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="80" y="1306" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#111827">6. Confidence Composer</text><text x="80" y="1344" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Aggregate verifier signals; calibrate score ∈ [0,1].</text>
<text x="80" y="1370" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Policy: ≥0.90 Verified; 0.70–0.90 Likely; 0.40–0.70 Unverified; &lt;0.40 Block.</text><circle cx="1290" cy="1294" r="16" fill="#111827" /><text x="1283" y="1301" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">6</text><line x1="700.0" y1="1420" x2="700.0" y2="1452" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1452" width="1280" height="130" rx="18" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="80" y="1484" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#111827">7. Output Rebuilder 2.0</text><text x="80" y="1522" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Emit only passing spans; auto citation map &amp; badges.</text>
<text x="80" y="1548" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Option: Verbatim‑from‑source mode for high‑risk domains.</text><circle cx="1290" cy="1472" r="16" fill="#111827" /><text x="1283" y="1479" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">7</text><line x1="700.0" y1="1598" x2="700.0" y2="1630" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1630" width="1280" height="130" rx="18" ry="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="80" y="1662" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#111827">8. Observability &amp; Feedback</text><text x="80" y="1700" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Per‑claim logs, evidence hashes, confidence overlay UI.</text>
<text x="80" y="1726" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#111827">• Feedback loop to refine thresholds and corpora.</text><circle cx="1290" cy="1650" r="16" fill="#111827" /><text x="1283" y="1657" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff">8</text><rect x="810" y="1294" width="520" height="210" rx="14" ry="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="826" y="1326" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#312e81">Score → Action Policy</text><text x="830" y="1364" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#1e293b">≥ 0.90  Verified (emit with sources)</text><text x="830" y="1390" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#1e293b">0.70–0.90  Likely True (badge + sources)</text><text x="830" y="1416" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#1e293b">0.40–0.70  Unverified (redline/ask/alternatives)</text><text x="830" y="1442" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#1e293b">&lt; 0.40  Block / request clarification</text><text x="60" y="2070" font-family="Inter,Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#6b7280">© 2025 Anurag Basistha • ULTIMA‑X pipeline — evidence‑first generation with verifier mesh &amp; calibrated uncertainty</text></svg>